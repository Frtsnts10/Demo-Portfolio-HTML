<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Alex Mercer - Minimalist Neo-Brutalist Portfolio">
  
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="mediaqueries.css">
  
  <title>Alex Mercer | Developer</title>
</head>
<body>

  <!-- Floating Navbar (Pill Design) -->
  <nav class="floating-nav">
    <div class="nav-container">
      <a href="#hero" class="nav-logo">AM.</a>
      <div class="nav-links">
        <a href="#about" class="nav-link">About</a>
        <a href="#work" class="nav-link">Work</a>
        <a href="#contact" class="nav-link">Contact</a>
      </div>
      <button class="theme-toggle" id="theme-toggle" aria-label="Toggle Theme">
        <svg class="sun-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
        <svg class="moon-icon" viewBox="0 0 24 24" width="20" height="20" stroke="currentColor" stroke-width="2" fill="none"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
      </button>
    </div>
  </nav>

  <main>
    <!-- Background Marquee Text -->
    <div class="marquee-bg">
      <div class="marquee-track">
        <span>DEVELOPER DESIGNER ENGINEER CREATOR</span>
        <span>DEVELOPER DESIGNER ENGINEER CREATOR</span>
      </div>
    </div>

    <!-- Hero Section -->
    <section id="hero" class="fade-up">
      <div class="hero-content">
        <div class="status-badge" id="profile-status"></div>
        <h1 class="giant-text" id="profile-title"></h1>
        <p class="hero-desc" id="profile-desc"></p>
        <a href="#work" class="btn-primary">View Projects <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" stroke-width="2" fill="none"><path d="M5 12h14M12 5l7 7-7 7"/></svg></a>
      </div>
    </section>

    <!-- Bento Grid Section (About & Skills) -->
    <section id="about" class="bento-container fade-up">
      <!-- Bento Box 1: About -->
      <div class="bento-box bento-large about-box">
        <h2 class="bento-title">WHO I AM</h2>
        <p class="bento-text" id="about-content"></p>
      </div>

      <!-- Bento Box 2: Skills Pills -->
      <div class="bento-box bento-medium skills-box">
        <h2 class="bento-title">SKILLSET</h2>
        <div class="pill-container" id="skills-container"></div>
      </div>

      <!-- Bento Box 3: Experience Timeline -->
      <div class="bento-box bento-tall experience-box">
        <h2 class="bento-title">EXPERIENCE</h2>
        <div class="timeline" id="experience-container"></div>
      </div>
    </section>

    <!-- Projects Section -->
    <section id="work" class="fade-up">
      <h2 class="section-heading">SELECTED WORKS</h2>
      <div class="bento-container projects-grid" id="projects-container"></div>
    </section>

    <!-- Contact Section -->
    <section id="contact" class="bento-container fade-up">
      <div class="bento-box bento-xl contact-box">
        <h2 class="giant-text contact-title">LET'S TALK.</h2>
        <div class="contact-links">
          <a href="#" class="contact-pill" id="email-link">Email</a>
          <a href="#" class="contact-pill" id="github-link">GitHub</a>
        </div>
      </div>
    </section>
  </main>

  <footer>
    <p>© <span id="year"></span> Alex Mercer. Built with Vanilla Web Tech.</p>
  </footer>

  <script src="data.js"></script>
  <script src="script.js"></script>

  <!-- Vercel Web Analytics -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>
  <script defer src="/_vercel/insights/script.js"></script>
</body>
</html>
